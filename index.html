function rollers(P, x, n, wl, amp, base) {
  for (let i = 0; i < n; i++) { P.push([x + wl * i + wl / 2, base - amp]); P.push([x + wl * (i + 1), base]); }

}

// ======================= РЕЛЬЕФ =======================
function makeHeightfield(points, step) {
  const n = points.length, xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  const d = [], m = [];
  for (let i = 0; i < n - 1; i++) d[i] = (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]);
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  const out = []; let k = 0;
  for (let x = xs[0]; x <= xs[n - 1]; x += step) {
    while (k < n - 2 && x > xs[k + 1]) k++;
    const h = xs[k + 1] - xs[k], t = (x - xs[k]) / h, t2 = t * t, t3 = t2 * t;
    out.push((2 * t3 - 3 * t2 + 1) * ys[k] + (t3 - 2 * t2 + t) * h * m[k] + (-2 * t3 + 3 * t2) * ys[k + 1] + (t3 - t2) * h * m[k + 1]);
  }
  return { x0: xs[0], step, ys: out };
}
const HF = makeHeightfield(LEVEL.points, 10);

  return HF.ys[i] * (1 - t) + HF.ys[i + 1] * t;
}

const Sfx = {

  init() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { this.ctx = null; } },
  tone(f, d, type, vol, slideTo) {
    const c = this.ctx; if (!c) return;

      const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);

      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.02);
    } catch (e) { /* без звука */ }
  },
  noise(d, vol) {
    const c = this.ctx; if (!c) return;
    try {
      const len = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);

// ======================= НАКЛОН ТЕЛЕФОНА =======================
// Крен вокруг оси экрана считаем по направлению силы тяжести; знак определяет калибровка («наклони вправо»).
const Tilt = {
  on: false, raw: 0, prev: null, smooth: undefined, sign: 1, base: 0,
  handler(e) {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null || a.y == null) return;
    if (Math.hypot(a.x, a.y) < 2) return;      // телефон лежит экраном вверх: крен не определить
    const psi = Math.atan2(a.x, a.y) * 180 / Math.PI;
    if (Tilt.prev === null) Tilt.prev = psi;
    let d = psi - Tilt.prev; while (d > 180) d -= 360; while (d < -180) d += 360;
    Tilt.prev = psi; Tilt.raw += d;
    Tilt.smooth = Tilt.smooth === undefined ? Tilt.raw : Tilt.smooth + (Tilt.raw - Tilt.smooth) * 0.35;
  },
  val() { return Tilt.on && Tilt.smooth !== undefined ? Tilt.sign * (Tilt.smooth - Tilt.base) : 0; },
  async enable() {
    try {
      if (typeof DeviceMotionEvent === 'undefined') return false;
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        const r = await DeviceMotionEvent.requestPermission();
        if (r !== 'granted') return false;
      }
      window.addEventListener('devicemotion', Tilt.handler);
      Tilt.on = true; return true;
    } catch (e) { return false; }
  }
};

function line(g, w, color, x1, y1, x2, y2) { g.lineStyle(w, color, 1); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokePath(); }

class RaceScene extends Phaser.Scene {

    const brakeC = { x: W - 222, y: H - 62 }, fwdC = { x: 222, y: H - 62 };
    const hit = (x, y) => {
      if (x >= W / 2) return Math.hypot(x - brakeC.x, y - brakeC.y) < 70 ? 'BR' : 'GAS';
      return Math.hypot(x - fwdC.x, y - fwdC.y) < 70 ? 'LF' : 'LB';
    };
    this.input.on('pointerdown', p => { Sfx.init(); this.ctl.held[p.id] = hit(p.x, p.y); });
    this.input.on('pointermove', p => { if (p.isDown && this.ctl.held[p.id] !== undefined) this.ctl.held[p.id] = hit(p.x, p.y); });
    this.input.on('pointerup', p => { delete this.ctl.held[p.id]; });
    this.input.on('pointerupoutside', p => { delete this.ctl.held[p.id]; });
    const kb = this.input.keyboard, set = (names, key, v) => names.forEach(n => kb.on((v ? 'keydown-' : 'keyup-') + n, () => { Sfx.init(); this.ctl[key] = v; }));
    [[['RIGHT', 'D'], 'gas'], [['LEFT', 'A'], 'brake'], [['UP', 'W'], 'lb'], [['DOWN', 'S'], 'lf']].forEach(([names, key]) => { set(names, key, true); set(names, key, false); });
  }
  held(name) { return Object.values(this.ctl.held).includes(name); }
  readInput() {
    const c = this.ctl;
    if (c.force) return c.force;
    let lean = 0;
    if (c.lb || this.held('LB')) lean -= 1;
    if (c.lf || this.held('LF')) lean += 1;
    if (lean === 0 && Tilt.on) {
      const eff = Tilt.val() - this.neutral, dz = 6;
      if (Math.abs(eff) > dz) lean = Phaser.Math.Clamp((Math.abs(eff) - dz) / 20, 0, 1) * Math.sign(eff);

    return { gas: !!(c.gas || this.held('GAS')), brake: !!(c.brake || this.held('BR')), lean };
  }

  // ---------- рельеф ----------
  buildTerrain() {
    const M = this.M, g = this.add.graphics().setDepth(0);
    const inR = (x, r) => r.some(a => x >= a[0] && x <= a[1]);
    const kind = x => inR(x, LEVEL.wood) ? 'wood' : inR(x, LEVEL.concrete) ? 'conc' : 'dirt';
    const bottom = 1400, n = HF.ys.length;
    // нарисованный рельеф: полосы текстуры по рельефу (10 px, поворот по наклону)
    const SW = 10;
    const mk = (key, prefix, surf, fgH, sh) => {
      const tx = this.textures.get(key), TW = tx.getSourceImage().width, TH = sh || tx.getSourceImage().height, NF = Math.floor((TW - 14) / SW);
      for (let k = 0; k < NF; k++) { tx.add(prefix + 's' + k, 0, k * SW, 0, SW + 3, TH); if (fgH) tx.add(prefix + 'f' + k, 0, k * SW, 0, SW + 3, fgH); }
      return { key, prefix, surf, TH, NF, fgH };
    };
    const T = { dirt: mk('ground', 'd', 34, 40), wood: mk('wood', 'w', 2, 0, 52), conc: mk('conc', 'c', 2, 0, 52) };
    const under = { dirt: [[40, 0x78563c], [90, 0x6b4a33], [140, 0x5f402c], [190, 0x563a27]], wood: [[20, 0xa9783f], [90, 0x9a6b37], [200, 0x8a5c2c]], conc: [[20, 0x9a9ea5], [90, 0x8d9199], [200, 0x7f838b]] };
    for (let i = 0; i < n - 1; i++) {
      const x = HF.x0 + i * HF.step, y1 = HF.ys[i], y2 = HF.ys[i + 1], xe = x + HF.step + 0.6, kd = kind(x), t = T[kd];
      under[kd].forEach(([d, col]) => { g.fillStyle(col, 1); g.fillPoints([{ x, y: y1 + d }, { x: xe, y: y2 + d }, { x: xe, y: bottom }, { x, y: bottom }], true); });
      const ang = Math.atan2(y2 - y1, HF.step), fi = ((i % t.NF) + t.NF) % t.NF;
      this.add.image(x, y1, t.key, t.prefix + 's' + fi).setOrigin(0, t.surf / t.TH).setRotation(ang).setDepth(0.4);
      if (t.fgH) this.add.image(x, y1, t.key, t.prefix + 'f' + fi).setOrigin(0, t.surf / t.fgH).setRotation(ang).setDepth(6);
    }
    const og = this.add.graphics().setDepth(0.6);
    for (let i = 0; i < n - 1; i++) {
      const x = HF.x0 + i * HF.step, kd = kind(x); if (kd === 'dirt') continue;
      og.lineStyle(4, kd === 'wood' ? 0x3b2410 : 0x3d4148, 1); og.beginPath(); og.moveTo(x, HF.ys[i]); og.lineTo(x + HF.step, HF.ys[i + 1]); og.strokePath();
    }
    let s = 5; const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = 0; i < n - 1; i++) {
      const x1 = HF.x0 + i * HF.step, y1 = HF.ys[i], x2 = x1 + HF.step, y2 = HF.ys[i + 1];
      const len = Math.hypot(x2 - x1, y2 - y1), ang = Math.atan2(y2 - y1, x2 - x1);
      const nx = -Math.sin(ang), ny = Math.cos(ang);
      const body = M.Bodies.rectangle((x1 + x2) / 2 + nx * 30, (y1 + y2) / 2 + ny * 30, len + 3, 60, { isStatic: true, angle: ang, friction: 1, frictionStatic: 1, restitution: 0, label: 'ground' });
      this.matter.world.add(body);
    }
    const fx = LEVEL.finishX, fy = groundY(fx), f = this.add.graphics().setDepth(1);
    f.fillStyle(0x30363c, 1); f.fillRect(fx - 8, fy - 200, 10, 200); f.fillRect(fx + 150, fy - 200, 10, 200);
    for (let i = 0; i < 19; i++) for (let j = 0; j < 3; j++) { f.fillStyle((i + j) % 2 ? 0x111111 : 0xffffff, 1); f.fillRect(fx + i * 8 + 2, fy - 200 + j * 14, 8, 14); }
    this.add.text(fx + 78, fy - 245, 'ФИНИШ', { fontFamily: 'Arial', fontStyle: 'bold', fontSize: '38px', color: '#fff', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5).setDepth(1);
    LEVEL.checkpoints.slice(1).forEach(cx => { const cy = groundY(cx); f.fillStyle(0x30363c, 1); f.fillRect(cx, cy - 90, 4, 90); f.fillStyle(0xffd23f, 1); f.fillTriangle(cx + 4, cy - 90, cx + 4, cy - 66, cx + 38, cy - 78); });
    const sy = groundY(LEVEL.startX);
    f.fillStyle(0x30363c, 1); f.fillRect(LEVEL.startX - 120, sy - 150, 8, 150); f.fillRect(LEVEL.startX + 80, sy - 150, 8, 150);
    f.fillStyle(0x1f6f4d, 1); f.fillRoundedRect(LEVEL.startX - 130, sy - 190, 230, 52, 8);
    this.add.text(LEVEL.startX - 15, sy - 164, 'ПАМП-ТРЕК', { fontFamily: 'Arial', fontStyle: 'bold', fontSize: '30px', color: '#fff' }).setOrigin(0.5).setDepth(1);
  }

  // ---------- байк (рама + два колеса на шарнирах, как в Hill Climb Racing) ----------
  buildBike() {
    const M = this.M, B = M.Bodies, Body = M.Body, filt = { group: -7 };
    const wopt = (label) => ({ label, friction: 1, frictionStatic: 1, restitution: 0, density: 0.0028, frictionAir: 0.0004, collisionFilter: filt });
    this.wr = B.circle(-HALF_BASE, 0, WHEEL_R, wopt('wheel'));
    this.wf = B.circle(HALF_BASE, 0, WHEEL_R, wopt('wheel'));
    const frame = B.rectangle(0, -12, 74, 14, { label: 'frame', density: 0.004, friction: 0.05, restitution: 0, collisionFilter: filt });
    const head = B.circle(14, -82, 10, { label: 'head', isSensor: true, density: 0.0003, collisionFilter: filt });
    const hips = B.circle(-10, -44, 9, { label: 'hips', isSensor: true, density: 0.0003, collisionFilter: filt });
    this.bike = Body.create({ parts: [frame, head, hips], frictionAir: 0.002, restitution: 0, label: 'bike', collisionFilter: filt });
    this.anchorOff = { x: -this.bike.position.x, y: -this.bike.position.y };
    const pin = (wheel, lx) => M.Constraint.create({ bodyA: this.bike, pointA: { x: lx + this.anchorOff.x, y: this.anchorOff.y }, bodyB: wheel, pointB: { x: 0, y: 0 }, length: 0, stiffness: 0.95, damping: 0.1 });
    this.matter.world.add([this.bike, this.wr, this.wf, pin(this.wr, -HALF_BASE), pin(this.wf, HALF_BASE)]);
    this.shadow = this.add.ellipse(0, 0, 110, 12, 0x000000, 0.25).setDepth(2);
    this.trail = this.add.graphics().setDepth(3);
    this.trailPts = [];
    // нарисованный байк: рама с гонщиком + два вращающихся колеса (ступицы совпадают с шарнирами физики)
    const K = (2 * HALF_BASE) / 362.5, WS = (2 * WHEEL_R + 1.5) / 256;
    this.wheelR = this.add.image(0, 0, 'wheel').setScale(WS).setDepth(5);
    this.wheelF = this.add.image(0, 0, 'wheel').setScale(WS).setDepth(5);
    this.riderI = this.add.image(-HALF_BASE, 0, 'rider').setOrigin(17 / 420, 461 / 509).setScale(K);
    this.bikeC = this.add.container(0, 0, [this.riderI]).setDepth(5.5);
  }
  anchor() {
    const b = this.bike, c = Math.cos(b.angle), s = Math.sin(b.angle);
    return { x: b.position.x + c * this.anchorOff.x - s * this.anchorOff.y, y: b.position.y + s * this.anchorOff.x + c * this.anchorOff.y };
  }
  local(lx, ly) {
    const a = this.anchor(), c = Math.cos(this.bike.angle), s = Math.sin(this.bike.angle);
    return { x: a.x + c * lx - s * ly, y: a.y + s * lx + c * ly };
  }
  allBodies() { return [this.bike, this.wr, this.wf]; }
  placeBike(x, speed) {
    const Body = this.M.Body, sl = slopeAt(x), ay = groundY(x) - WHEEL_R - 6;
    const c = Math.cos(sl), s = Math.sin(sl);
    Body.setAngle(this.bike, sl);
    Body.setPosition(this.bike, { x: x - (c * this.anchorOff.x - s * this.anchorOff.y), y: ay - (s * this.anchorOff.x + c * this.anchorOff.y) });
    Body.setPosition(this.wr, { x: x - c * HALF_BASE, y: ay - s * HALF_BASE });
    Body.setPosition(this.wf, { x: x + c * HALF_BASE, y: ay + s * HALF_BASE });
    this.allBodies().forEach(b => { Body.setVelocity(b, { x: c * speed, y: s * speed }); Body.setAngularVelocity(b, 0); });
    Body.setAngle(this.wr, 0); Body.setAngle(this.wf, 0);
    this.lastAngle = this.bike.angle; this.airRot = 0; this.airTicks = 0; this.wasAir = false;
    this.camTarget.setPosition(x, ay);
  }
  setPitch(omega) {   // вращаем всю систему (раму и колёса) вокруг общего центра масс
    const bs = this.allBodies(); let m = 0, cx = 0, cy = 0;
    bs.forEach(b => { m += b.mass; cx += b.position.x * b.mass; cy += b.position.y * b.mass; });
    cx /= m; cy /= m;
    const dw = omega - this.bike.angularVelocity;
    bs.forEach(b => this.M.Body.setVelocity(b, { x: b.velocity.x - dw * (b.position.y - cy), y: b.velocity.y + dw * (b.position.x - cx) }));
    this.M.Body.setAngularVelocity(this.bike, omega);
  }
  kick(f) { this.allBodies().forEach(b => this.M.Body.setVelocity(b, { x: b.velocity.x * f, y: b.velocity.y * f })); }

  // ---------- интерфейс ----------
  buildHud() {
    const st = (size, color, sw) => ({ fontFamily: 'Arial', fontStyle: 'bold', fontSize: size + 'px', color: color || '#fff', stroke: '#000', strokeThickness: sw === undefined ? 4 : sw });
    const D = 50;
    this.hudTime = this.add.text(20, 12, '0:00.0', st(36)).setScrollFactor(0).setDepth(D);
    this.hudBest = this.add.text(20, 58, this.best.time ? 'Рекорд: ' + fmt(this.best.time) : 'Рекорда ещё нет', st(17, '#ffe9a8')).setScrollFactor(0).setDepth(D);
    this.hudScore = this.add.text(W - 20, 12, 'Очки: 0', st(30)).setOrigin(1, 0).setScrollFactor(0).setDepth(D);
    this.hudFlips = this.add.text(W - 20, 48, 'Сальто: 0', st(20, '#bfe9e5')).setOrigin(1, 0).setScrollFactor(0).setDepth(D);
    this.hudCombo = this.add.text(W - 20, 76, '', st(24, '#ffe14d')).setOrigin(1, 0).setScrollFactor(0).setDepth(D);
    this.speedG = this.add.graphics().setScrollFactor(0).setDepth(D);
    this.fx = this.add.graphics().setScrollFactor(0).setDepth(45);
    this.pedalG = this.add.graphics().setScrollFactor(0).setDepth(D);
    this.hudG = this.add.graphics().setScrollFactor(0).setDepth(D - 1);
    this.msg = this.add.text(W / 2, 270, '', Object.assign(st(30), { align: 'center' })).setOrigin(0.5).setScrollFactor(0).setDepth(60).setAlpha(0);
    this.pop = this.add.text(W / 2, 150, '', st(54, '#ffe14d', 7)).setOrigin(0.5).setScrollFactor(0).setDepth(60).setAlpha(0);
    this.sub = this.add.text(W / 2, 205, '', st(26, '#ffffff', 5)).setOrigin(0.5).setScrollFactor(0).setDepth(60).setAlpha(0);
  }
  popup(text, color, sub) {
    this.pop.setText(text).setColor(color || '#ffe14d').setAlpha(1).setY(150).setScale(0.4);
    this.tweens.killTweensOf(this.pop);
    this.tweens.add({ targets: this.pop, scale: 1.1, duration: 200, ease: 'Back.Out' });
    this.tweens.add({ targets: this.pop, alpha: 0, y: 105, delay: 1000, duration: 500 });
    this.sub.setText(sub || '').setAlpha(sub ? 1 : 0);
    this.tweens.killTweensOf(this.sub);
    if (sub) this.tweens.add({ targets: this.sub, alpha: 0, delay: 1000, duration: 500 });
  }

  begin() {   // вызывается после стартового экрана
    if (this.state !== 'wait') return;
    this.state = 'ready';
    this.msg.setText('Держи ГАЗ справа и поехали!').setAlpha(1);
  }

  // ---------- игровой цикл ----------
  update(time, delta) {
    this.slow += ((this.wantSlow ? 0.5 : 1) - this.slow) * 0.1;
    this.acc += Math.min(delta, 100) * this.slow;
    if (this.state === 'run') this.time_ += Math.min(delta, 100) / 1000;
    let guard = 0;
    while (this.acc >= STEP && guard++ < 6) { this.acc -= STEP; this.tick(); this.matter.world.step(STEP); }
    this.render();
  }

  tick() {
    const M = this.M, Body = M.Body, b = this.bike, wr = this.wr, wf = this.wf;
    if (this.state === 'done' || this.state === 'wait') return;
    const inp = this.readInput();
    if (this.state === 'ready') {
      if (inp.gas) { this.state = 'run'; this.msg.setAlpha(0); } else return;
    }
    const near = w => groundY(w.position.x) - w.position.y <= WHEEL_R / Math.cos(slopeAt(w.position.x)) + 4;
    const tR = near(wr), tF = near(wf), touching = tR || tF;
    this.airTicks = touching ? 0 : this.airTicks + 1;
    const air = this.airTicks > 3;
    const a = this.anchor(), sl = slopeAt(a.x);
    const sp0 = Math.hypot(b.velocity.x, b.velocity.y);

    if (this.state === 'crash') { this.crashTimer -= STEP; if (this.crashTimer <= 0) this.respawn(); return; }
    if (Tilt.on && !air) this.neutral += (Tilt.val() - this.neutral) * 0.02;
    this.boost *= 0.994; this.comboT = Math.max(0, this.comboT - STEP / 1000);
    if (this.comboT === 0) this.combo = 0;

    if (this.state === 'run') {
      // ---- газ и тормоз ----
      const maxW = (BASE_CAP + this.boost) / WHEEL_R;
      if (inp.gas) {
        if (wr.angularVelocity < maxW) Body.setAngularVelocity(wr, Math.min(maxW, wr.angularVelocity + 0.014));
        if (tR) this.setPitch(b.angularVelocity - 0.0012);
      }
      if (inp.brake) {
        Body.setAngularVelocity(wr, wr.angularVelocity * 0.86); Body.setAngularVelocity(wf, wf.angularVelocity * 0.88);
        if (touching) this.kick(0.985);
      }
      // ---- наклон: на земле поднимает/опускает нос, в воздухе крутит ----
      if (air) {
        if (Math.abs(inp.lean) > 0.05 && this.airTicks > 6) {
          this.setPitch(b.angularVelocity + (inp.lean * AIR_SPIN - b.angularVelocity) * 0.35);
        } else {
          const target = sl + Math.PI * 2 * Math.round((b.angle - sl) / (Math.PI * 2));
          const want = Phaser.Math.Clamp((target - b.angle) * 0.12, -0.3, 0.3);
          this.setPitch(b.angularVelocity + (want - b.angularVelocity) * 0.25);
        }
        this.airRot += b.angle - this.lastAngle;
      } else if (Math.abs(inp.lean) > 0.05) {
        this.setPitch(Phaser.Math.Clamp(b.angularVelocity + inp.lean * 0.01, -0.07, 0.07));
      }
      // ---- вилли: едем на заднем колесе ----
      if (tR && !tF && b.angle - sl < -0.3) {
        this.wheelieT += STEP / 1000;
        if (this.wheelieT > 1) { this.wheelieT -= 1; this.score += 30; this.popup('ВИЛЛИ!', '#7dd7ff', '+30'); }
      } else this.wheelieT = Math.max(0, this.wheelieT - STEP / 1000);
    } else if (this.state === 'finish') {
      if (touching) this.kick(0.985);
      Body.setAngularVelocity(wr, wr.angularVelocity * 0.97);
    }
    this.lastAngle = b.angle;
    const sp = Math.hypot(b.velocity.x, b.velocity.y);
    if (sp > 12 && this.state === 'run') this.kick(12 / sp);
    this.wantSlow = this.state === 'run' && air && this.airTicks > 28 && Math.abs(this.airRot) > 1.2 && Math.abs(this.airRot) < 5.6;

    // приземление
    if (this.wasAir && !air && touching && this.state === 'run') {
      const rel = Math.abs(Phaser.Math.Angle.Wrap(b.angle - sl));
      const turns = Math.floor(Math.abs(this.airRot) / (Math.PI * 2) + 0.25);
      if (rel > 1.9) { this.crash('Упс!'); return; }
      this.landFx(Math.min(1, this.lastAir / 40));
      if (turns >= 1) this.trick(turns, this.airRot > 0);
    }
    if (air && !this.wasAir) this.airRot = 0;
    if (!air && touching) this.airRot = 0;
    if (air) this.lastAir = this.airTicks;
    this.wasAir = air;

    if (this.state === 'run') {
      const head = this.local(14, -82), hips = this.local(-10, -44);
      if (head.y + 6 > groundY(head.x) || hips.y + 4 > groundY(hips.x)) { this.crash('Упс! Ещё раз!'); return; }
      const nxt = LEVEL.checkpoints[this.cpIndex + 1];
      if (nxt !== undefined && a.x > nxt) { this.cpIndex++; this.checkpoint = nxt; this.popup('Чекпоинт!', '#ffffff'); Sfx.check(); }
      if (a.x > LEVEL.finishX) this.finish();
    }
    if (a.y > 1500 || a.x < -300) this.crash('Упс!');
    if (tR && !air && sp0 > 3.2 && (++this.tickN) % 3 === 0) this.dust(wr.position.x, wr.position.y + WHEEL_R - 2, -sp0 * 0.25, 1);
  }

  trick(turns, forward) {
    this.combo = this.comboT > 0 ? this.combo + 1 : 1; this.comboT = 6;
    const pts = 100 * turns * this.combo; this.score += pts; this.flips += turns;
    this.boost = Math.min(3.5, this.boost + 1.2 * turns);
    const name = turns > 1 ? 'СУПЕР-САЛЬТО x' + turns + '!' : (forward ? 'ФРОНТФЛИП!' : 'САЛЬТО!');
    this.popup(name, '#ffe14d', '+' + pts + (this.combo > 1 ? '   комбо x' + this.combo : ''));
    Sfx.flip(); this.shake = 0.012;
    const a = this.anchor(); this.burst(a.x, a.y - 40, 46, [0xffe14d, 0xff6b2c, 0x2bb673, 0x4db8ff, 0xff4d8d, 0xffffff]);
  }
  landFx(power) {
    const a = this.anchor(); Sfx.land();
    this.dust(a.x, a.y + 20, 0, 8 + Math.floor(power * 14));
    this.shake = Math.max(this.shake, 0.004 + power * 0.006);
  }
  crash(text) {
    if (this.state !== 'run') return;
    this.state = 'crash'; this.crashTimer = 1000; this.wantSlow = false;
    this.popup(text, '#ff6b6b'); Sfx.crash(); this.shake = 0.02;
    const a = this.anchor(); this.burst(a.x, a.y - 30, 24, [0xffffff, 0xffd23f]);
    this.combo = 0; this.boost = 0;
  }
  respawn() {
    this.placeBike(this.checkpoint === 0 ? LEVEL.startX : this.checkpoint + 60, this.checkpoint === 0 ? 0 : 4);
    this.state = 'run';
  }
  finish() {
    this.state = 'finish'; this.wantSlow = false;
    const t = this.time_;
    const medal = t <= MEDAL_TIMES[0] ? 0 : t <= MEDAL_TIMES[1] ? 1 : t <= MEDAL_TIMES[2] ? 2 : -1;
    const newRecord = !this.best.time || t < this.best.time;
    if (newRecord) this.best.time = t;
    if (this.score > (this.best.score || 0)) this.best.score = this.score;
    saveBest(this.best);
    this.result = { t, medal, newRecord };
    Sfx.fanfare();
    const a = this.anchor(); this.burst(a.x, a.y - 80, 90, [0xffe14d, 0xff6b2c, 0x2bb673, 0x4db8ff, 0xff4d8d, 0xffffff]);
    this.time.delayedCall(1500, () => this.showPodium());
  }

  // ---------- частицы ----------
  dust(x, y, vx, n) {
    for (let i = 0; i < n; i++) this.parts.push({ x, y, vx: vx + (Math.random() - 0.5) * 2.5, vy: -Math.random() * 1.6, life: 1, dec: 0.03 + Math.random() * 0.02, r: 3 + Math.random() * 4, col: 0xd9b88f, grav: 0.02 });
  }
  burst(x, y, n, cols) {
    for (let i = 0; i < n; i++) { const an = Math.random() * Math.PI * 2, v = 2 + Math.random() * 6; this.parts.push({ x, y, vx: Math.cos(an) * v, vy: Math.sin(an) * v - 3, life: 1, dec: 0.012 + Math.random() * 0.01, r: 3 + Math.random() * 3, col: cols[(Math.random() * cols.length) | 0], grav: 0.22 }); }
  }

  // гонщик на байке, стоит на месте (для пьедестала): контейнер, начало координат внизу по центру
  riderSprite(x, y, sc) {
    const WSZ = 198 / 256;
    const w1 = this.add.image(-193, -99, 'wheel').setScale(WSZ), w2 = this.add.image(169.5, -99, 'wheel').setScale(WSZ);
    const r = this.add.image(0, -560, 'rider').setOrigin(0.5, 0);
    return this.add.container(x, y, [w1, w2, r]).setScale(sc);
  }

  showPodium() {
    this.state = 'done';
    const { t, medal, newRecord } = this.result;
    const cx = W / 2, cy = H / 2;
    const root = this.add.container(0, 0).setScrollFactor(0).setDepth(100);
    const dim = this.add.rectangle(cx, cy, W, H, 0x04141a, 0.6);
    const panel = this.add.graphics();
    panel.fillStyle(0x000000, 0.35); panel.fillRoundedRect(cx - 386, cy - 212, 780, 440, 26);
    panel.fillStyle(0x10302f, 0.96); panel.fillRoundedRect(cx - 390, cy - 220, 780, 440, 26);
    panel.lineStyle(5, 0xffc93c, 1); panel.strokeRoundedRect(cx - 390, cy - 220, 780, 440, 26);
    const st = (size, color) => ({ fontFamily: 'Arial', fontStyle: 'bold', fontSize: size + 'px', color: color || '#fff' });
    const px = cx - 200, base = cy + 150, bw = 104;
    const blocks = [{ x: px - bw, h: 66, n: '2', c: 0xc3cad2, m: 1 }, { x: px, h: 104, n: '1', c: 0xf2c230, m: 0 }, { x: px + bw, h: 44, n: '3', c: 0xcd8a4e, m: 2 }];
    const g = this.add.graphics();
    g.fillStyle(0x000000, 0.25); g.fillEllipse(px, base + 4, 340, 18);
    blocks.forEach(b => { g.fillStyle(b.c, 1); g.fillRoundedRect(b.x - bw / 2 + 3, base - b.h, bw - 6, b.h, { tl: 8, tr: 8, bl: 0, br: 0 }); g.fillStyle(0xffffff, 0.22); g.fillRect(b.x - bw / 2 + 3, base - b.h, bw - 6, 6); });
    root.add([dim, panel, g]);
    blocks.forEach(b => root.add(this.add.text(b.x, base - b.h / 2 + 4, b.n, st(38, '#3a2a10')).setOrigin(0.5)));
    const rx = medal >= 0 ? blocks.find(k => k.m === medal).x : px + bw + 4, ry = medal >= 0 ? base - blocks.find(k => k.m === medal).h : base - 44;
    root.add(this.riderSprite(rx, ry, 0.27));
    const tx = cx + 170;
    root.add(this.add.text(tx, cy - 168, 'ФИНИШ, МИРОН!', st(34, '#ffe14d')).setOrigin(0.5));
    if (medal >= 0) {
      const col = [0xffd23f, 0xdfe4ea, 0xcd7f32][medal], mg = this.add.graphics();
      mg.fillStyle(0xd62828, 1); mg.fillTriangle(tx - 26, cy - 126, tx - 2, cy - 126, tx + 10, cy - 70); mg.fillStyle(0x2a6fd0, 1); mg.fillTriangle(tx + 26, cy - 126, tx + 2, cy - 126, tx - 10, cy - 70);
      mg.fillStyle(col, 1); mg.fillCircle(tx, cy - 48, 42); mg.lineStyle(5, 0xffffff, 0.85); mg.strokeCircle(tx, cy - 48, 42); mg.lineStyle(3, 0x000000, 0.25); mg.strokeCircle(tx, cy - 48, 32);
      mg.fillStyle(0xffffff, 0.4); mg.fillCircle(tx - 14, cy - 62, 9);
      root.add(mg);
      root.add(this.add.text(tx, cy - 48, ['1', '2', '3'][medal], st(40, '#3a2a10')).setOrigin(0.5));
      root.add(this.add.text(tx, cy + 18, ['ЗОЛОТО!', 'СЕРЕБРО!', 'БРОНЗА!'][medal], st(38, ['#ffd23f', '#e6ebf0', '#e8a366'][medal])).setOrigin(0.5));
    } else {
      root.add(this.add.text(tx, cy - 40, 'Почти! Ещё разок?', Object.assign(st(36, '#ffe9a8'), { align: 'center' })).setOrigin(0.5));
    }
    root.add(this.add.text(tx, cy + 62, fmt(t) + (newRecord ? '  новый рекорд!' : ''), st(26)).setOrigin(0.5));
    root.add(this.add.text(tx, cy + 92, (newRecord ? '' : 'рекорд ' + fmt(this.best.time) + '   ') + 'сальто ' + this.flips + '   очки ' + this.score, st(18, '#bfe9e5')).setOrigin(0.5));
    const bg = this.add.graphics(); bg.fillStyle(0x0a6b3a, 1); bg.fillRoundedRect(tx - 120, cy + 122, 240, 56, 28); bg.fillStyle(0x2bb673, 1); bg.fillRoundedRect(tx - 120, cy + 118, 240, 56, 28); bg.lineStyle(3, 0xffffff, 0.9); bg.strokeRoundedRect(tx - 120, cy + 118, 240, 56, 28);
    const btn = this.add.rectangle(tx, cy + 146, 240, 56, 0x000000, 0.001).setInteractive({ useHandCursor: true });
    const btnT = this.add.text(tx, cy + 146, 'Ещё раз', st(28)).setOrigin(0.5);
    btn.on('pointerup', () => { window.__autostart = true; this.scene.restart(); });
    root.add([bg, btn, btnT]);
    this.hudBest.setText('Рекорд: ' + fmt(this.best.time));
    root.setAlpha(0); this.tweens.add({ targets: root, alpha: 1, duration: 300 });
  }

  // ---------- отрисовка ----------
  render() {
    const b = this.bike, a = this.anchor(), wr = this.wr, wf = this.wf, sp = Math.hypot(b.velocity.x, b.velocity.y);
    const inp = this.readInput();
    this.crouchVis += ((inp.brake ? 1 : 0) - this.crouchVis) * 0.2;
    this.tiltVis += (inp.lean - this.tiltVis) * 0.3;
    this.riderI.setScale(this.riderI.scaleX, (2 * HALF_BASE) / 362.5 * (1 - this.crouchVis * 0.05));
    this.bikeC.setPosition(a.x, a.y).setRotation(b.angle);
    this.updateBg();
    this.wheelR.setPosition(wr.position.x, wr.position.y).setRotation(wr.angle);
    this.wheelF.setPosition(wf.position.x, wf.position.y).setRotation(wf.angle);
    const gy = groundY(a.x), hgt = Math.max(0, gy - a.y - WHEEL_R);
    this.shadow.setPosition(a.x, gy + 3).setRotation(slopeAt(a.x)).setScale(Math.max(0.4, 1 - hgt / 400), 1).setAlpha(Math.max(0.05, 0.28 - hgt / 700));
    this.camTarget.setPosition(a.x + b.velocity.x * 7, a.y);
    if (this.shake > 0) {
      const cam = this.cameras.main;
      cam.setScroll(cam.scrollX + (Math.random() - 0.5) * this.shake * 900, cam.scrollY + (Math.random() - 0.5) * this.shake * 900);
      this.shake *= 0.85; if (this.shake < 0.0008) this.shake = 0;
    }
    if (sp > 5 && this.state === 'run') this.trailPts.push({ x: a.x, y: a.y - 20, l: 1 });
    this.trail.clear();
    this.trailPts = this.trailPts.filter(p => (p.l -= 0.05) > 0);
    this.trailPts.forEach(p => { this.trail.fillStyle(0xffffff, p.l * 0.25); this.trail.fillCircle(p.x, p.y, 4 + p.l * 6); });
    this.partG = this.partG || this.add.graphics().setDepth(8);
    this.partG.clear();
    this.parts = this.parts.filter(p => (p.life -= p.dec) > 0);
    this.parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= 0.985; this.partG.fillStyle(p.col, Math.min(1, p.life * 1.4)); this.partG.fillCircle(p.x, p.y, p.r * (0.4 + p.life * 0.6)); });
    this.fx.clear();
    const intensity = Phaser.Math.Clamp((sp - 6) / 4, 0, 1);
    if (intensity > 0.05) {
      for (let i = 0; i < 14; i++) {
        const y = Math.random() * H, x = Math.random() * W, len = 60 + Math.random() * 120 * intensity;
        this.fx.lineStyle(2, 0xffffff, 0.18 * intensity); this.fx.beginPath(); this.fx.moveTo(x, y); this.fx.lineTo(x - len, y); this.fx.strokePath();
      }
    }
    this.drawUi(sp, inp);
  }

  drawUi(sp, inp) {
    const g = this.pedalG; g.clear();
    const btn = (cx, cy, r, pressed, col, icon) => {
      const k = pressed ? 0.93 : 1;
      g.fillStyle(0x000000, 0.18); g.fillCircle(cx, cy + 4, r * k);
      g.fillStyle(col, pressed ? 0.9 : 0.5); g.fillCircle(cx, cy, r * k);
      g.lineStyle(3, 0xffffff, pressed ? 0.95 : 0.5); g.strokeCircle(cx, cy, r * k);
      icon(cx, cy, r * k);
    };
    const bars = (cx, cy, r) => { g.fillStyle(0xffffff, 0.95); g.fillRoundedRect(cx - r * 0.38, cy - r * 0.3, r * 0.76, r * 0.18, 3); g.fillRoundedRect(cx - r * 0.38, cy, r * 0.76, r * 0.18, 3); };
    const rot = (cx, cy, r, ccw) => {   // круговая стрелка: назад (против часовой) / вперёд (по часовой)
      const rad = r * 0.46, m = ccw ? -1 : 1, a0 = Math.PI * 0.15, a1 = Math.PI * 1.35;
      g.lineStyle(7, 0xffffff, 0.95); g.beginPath();
      for (let k = 0; k <= 16; k++) { const an = a0 + (a1 - a0) * k / 16, px = cx + m * rad * Math.cos(an), py = cy + rad * Math.sin(an); if (k === 0) g.moveTo(px, py); else g.lineTo(px, py); }
      g.strokePath();
      const ex = cx + m * rad * Math.cos(a1), ey = cy + rad * Math.sin(a1), tx = -m * Math.sin(a1), ty = Math.cos(a1), nx = -ty, ny = tx;
      g.fillStyle(0xffffff, 0.95); g.fillTriangle(ex + tx * 16, ey + ty * 16, ex + nx * 12, ey + ny * 12, ex - nx * 12, ey - ny * 12);
    };
    const gasOn = this.held('GAS') || this.ctl.gas, brOn = this.held('BR') || this.ctl.brake;
    const lbOn = this.held('LB') || this.ctl.lb || inp.lean < -0.2, lfOn = this.held('LF') || this.ctl.lf || inp.lean > 0.2;
    btn(W - 92, H - 86, 66, gasOn, 0x1fa05a, (cx, cy, r) => {
      g.fillStyle(0x0e5a31, 1); g.fillRoundedRect(cx - r * 0.5, cy - r * 0.62, r, r * 1.24, 12);
      g.fillStyle(0xffffff, 0.95); g.fillTriangle(cx, cy - r * 0.42, cx - r * 0.3, cy + r * 0.02, cx + r * 0.3, cy + r * 0.02);
      g.fillRect(cx - r * 0.1, cy, r * 0.2, r * 0.36);
    });
    btn(W - 222, H - 62, 46, brOn, 0xc23b2b, bars);
    btn(92, H - 86, 66, lbOn, 0x2a6fd0, (cx, cy, r) => rot(cx, cy, r, true));
    btn(222, H - 62, 46, lfOn, 0x2a6fd0, (cx, cy, r) => rot(cx, cy, r, false));
    if (!this.labels) {
      const t = (x, y, s) => this.add.text(x, y, s, { fontFamily: 'Arial', fontStyle: 'bold', fontSize: '15px', color: '#fff', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setScrollFactor(0).setDepth(52);
      this.labels = [t(W - 92, H - 8, 'ГАЗ'), t(W - 222, H - 8, 'ТОРМОЗ'), t(92, H - 8, 'НАЗАД'), t(222, H - 8, 'ВПЕРЁД')];
    }
    const wx = W / 2, wy = 62, gg = this.hudG; gg.clear();
    gg.lineStyle(7, 0x000000, 0.35); gg.strokeCircle(wx, wy, 24);
    gg.lineStyle(5, 0xffffff, 0.85); gg.strokeCircle(wx, wy, 24);
    const ang = this.tiltVis * 0.9;
    gg.lineStyle(5, 0xff6b2c, 1); gg.beginPath(); gg.moveTo(wx - Math.cos(ang) * 24, wy - Math.sin(ang) * 24); gg.lineTo(wx + Math.cos(ang) * 24, wy + Math.sin(ang) * 24); gg.strokePath();
    gg.fillStyle(0xffffff, 1); gg.fillCircle(wx, wy, 5);
    const sg = this.speedG; sg.clear();
    const bx = 20, by = 90, bw = 170;
    sg.fillStyle(0x000000, 0.45); sg.fillRoundedRect(bx, by, bw, 14, 7);
    sg.fillStyle(this.boost > 0.5 ? 0x7dff9a : 0xffffff, 1); sg.fillRoundedRect(bx + 2, by + 2, Math.max(6, (bw - 4) * Phaser.Math.Clamp(sp / 11, 0, 1)), 10, 5);
    this.hudTime.setText(fmt(this.time_));
    this.hudScore.setText('Очки: ' + this.score); this.hudFlips.setText('Сальто: ' + this.flips);
    this.hudCombo.setText(this.combo > 1 ? 'КОМБО x' + this.combo : '');
  }
}

// ======================= ЗАПУСК И СТАРТОВЫЙ ЭКРАН =======================
new Phaser.Game({
  type: Phaser.AUTO, parent: 'game', width: W, height: H, backgroundColor: '#9edcf2',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: { default: 'matter', matter: { gravity: { y: 1 }, debug: false } },
  input: { activePointers: 4 },
  scene: [RaceScene]
});
(function startScreen() {
  const $ = id => document.getElementById(id);
  const start = $('start'), calib = $('calib'), bar = $('bar'), go = $('go'), skip = $('skip');
  function launch() {
    start.style.display = 'none'; Sfx.init();
    const tryBegin = () => { if (window.G && window.G.state === 'wait') window.G.begin(); else setTimeout(tryBegin, 100); };
    tryBegin();
  }
  skip.onclick = () => { Tilt.on = false; launch(); };
  go.onclick = async () => {
    Sfx.init();
    const ok = await Tilt.enable();
    if (!ok) { calib.textContent = 'Наклон не включился, играем кнопками'; setTimeout(launch, 900); return; }
    go.style.display = 'none'; skip.textContent = 'пропустить'; bar.style.display = 'block';
    calib.textContent = 'Держи телефон ровно, потом наклони ВПРАВО, как руль';
    Tilt.prev = null; Tilt.raw = 0; Tilt.smooth = undefined; Tilt.base = 0;
    const t0 = performance.now(); let base = null, done = false;
    const iv = setInterval(() => {
      if (Tilt.smooth === undefined) { if (performance.now() - t0 > 2500) { clearInterval(iv); Tilt.on = false; calib.textContent = 'Датчик не отвечает, играем кнопками'; setTimeout(launch, 900); } return; }
      if (base === null) { if (performance.now() - t0 > 900) base = Tilt.smooth; return; }
      const d = Tilt.smooth - base;
      bar.firstElementChild.style.width = (50 + Math.max(-45, Math.min(45, d)) / 45 * 50) + '%';
      if (Math.abs(d) > 22 && !done) {
        done = true; clearInterval(iv);
        Tilt.sign = d > 0 ? 1 : -1; Tilt.base = base; calib.textContent = 'Отлично! Наклон настроен';
        setTimeout(launch, 700);
      }
    }, 50);
    skip.onclick = () => { clearInterval(iv); Tilt.on = false; launch(); };
  };
})();
</script>
