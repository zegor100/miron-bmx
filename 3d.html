<script>
'use strict';
// ======================= ЗВУК =======================
const Sfx = {
  ctx: null,
  init() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { this.ctx = null; } },
  tone(f, d, type, vol, slideTo) { const c = this.ctx; if (!c) return; try { const o = c.createOscillator(), g = c.createGain(), t = c.currentTime; o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + d); g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.02); } catch (e) {} },
  noise(d, vol) { const c = this.ctx; if (!c) return; try { const len = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0); for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len); const s = c.createBufferSource(), g = c.createGain(); s.buffer = buf; g.gain.value = vol || 0.15; s.connect(g); g.connect(c.destination); s.start(); } catch (e) {} },
  click() { this.tone(760, 0.03, 'square', 0.035); },
  land() { this.noise(0.12, 0.12); this.tone(110, 0.12, 'sine', 0.15, 60); },
  flip() { [520, 660, 780, 1040].forEach((f, i) => setTimeout(() => this.tone(f, 0.16, 'square', 0.06), i * 70)); },
  crash() { this.noise(0.35, 0.25); this.tone(160, 0.3, 'sawtooth', 0.12, 50); },
  check() { this.tone(880, 0.12, 'triangle', 0.1); setTimeout(() => this.tone(1320, 0.18, 'triangle', 0.1), 110); },
  fanfare() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => setTimeout(() => this.tone(f, 0.28, 'triangle', 0.12), i * 130)); }
};

// ======================= НАКЛОН ТЕЛЕФОНА (руль) =======================
const Tilt = {
  on: false, raw: 0, prev: null, smooth: undefined, sign: 1, base: 0, sens: 1,
  handler(e) {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null || a.y == null) return;
    if (Math.hypot(a.x, a.y) < 2) return;
    const psi = Math.atan2(a.x, a.y) * 180 / Math.PI;
    if (Tilt.prev === null) Tilt.prev = psi;
    let d = psi - Tilt.prev; while (d > 180) d -= 360; while (d < -180) d += 360;
    Tilt.prev = psi; Tilt.raw += d;
    Tilt.smooth = Tilt.smooth === undefined ? Tilt.raw : Tilt.smooth + (Tilt.raw - Tilt.smooth) * 0.35;
  },
  val() { return Tilt.on && Tilt.smooth !== undefined ? Tilt.sign * (Tilt.smooth - Tilt.base) : 0; },
  async enable() {
    try {
      if (typeof DeviceMotionEvent === 'undefined') return false;
      if (typeof DeviceMotionEvent.requestPermission === 'function') { const r = await DeviceMotionEvent.requestPermission(); if (r !== 'granted') return false; }
      window.addEventListener('devicemotion', Tilt.handler); Tilt.on = true; return true;
    } catch (e) { return false; }
  }
};

// ======================= ТРАССА (высота по z, едем в сторону -z) =======================
const FINISH = -385, CPS = [0, -60, -130, -200, -290];
const PTS = [
  [20, 0], [0, 0], [-14, 0],
  // ролики-горки (памп)
  [-19, 0.55], [-24, 0], [-29, 0.6], [-34, 0], [-39, 0.65], [-44, 0], [-49, 0.7], [-54, 0], [-59, 0.75], [-64, 0],
  // кикер 1: вылет, яма, посадочная горка
  [-72, 0], [-76, 0.5], [-79, 1.2], [-80.8, 1.65], [-82, 1.0], [-84, 0.0], [-92, 0], [-96, 0.9], [-101, 1.0], [-106, 0.0], [-112, 0],
  // ролики
  [-117, 0.6], [-122, 0], [-127, 0.65], [-132, 0], [-137, 0.7], [-142, 0],
  // большой кикер 2
  [-150, 0], [-154, 0.55], [-157, 1.35], [-158.8, 1.85], [-160, 1.1], [-162, 0], [-172, 0], [-177, 1.1], [-183, 1.2], [-189, 0], [-195, 0],
  // финишные ролики
  [-201, 0.6], [-207, 0], [-213, 0.65], [-219, 0], [-225, 0.7], [-231, 0],
  [-237, 0.6], [-243, 0], [-249, 0.65], [-255, 0], [-261, 0.7], [-267, 0], [-273, 0.75], [-279, 0],
  // кикер 3
  [-286, 0], [-290, 0.6], [-293, 1.45], [-294.8, 1.95], [-296, 1.2], [-298, 0], [-308, 0], [-313, 1.2], [-319, 1.3], [-325, 0], [-331, 0],
  [-337, 0.6], [-343, 0], [-349, 0.65], [-355, 0], [-361, 0.7], [-367, 0], [-460, 0]
];
// монотонная кубическая интерполяция (Fritsch-Carlson)
function makeSpline(pts) {
  const n = pts.length, xs = pts.map(p => p[0]).reverse(), ys = pts.map(p => p[1]).reverse(); // x по возрастанию
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return z => {
    if (z <= xs[0]) return ys[0]; if (z >= xs[n - 1]) return ys[n - 1];
    let lo = 0, hi = n - 1; while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (xs[mid] <= z) lo = mid; else hi = mid; }
    const h = xs[hi] - xs[lo], t = (z - xs[lo]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[lo] + (t3 - 2 * t2 + t) * h * m[lo] + (-2 * t3 + 3 * t2) * ys[hi] + (t3 - t2) * h * m[hi];
  };
}
const hz = makeSpline(PTS);
const WALL0 = 3.0, WALLK = 0.2;
const wallH = x => { const a = Math.abs(x); if (a <= WALL0) return 0; if (a <= 6) return WALLK * (a - WALL0) * (a - WALL0); return Math.max(0, 1.8 - 0.3 * (a - 6)); };
const wallSlope = x => { const a = Math.abs(x); if (a <= WALL0) return 0; if (a <= 6) return 2 * WALLK * (a - WALL0) * Math.sign(x); return a < 12 ? -0.3 * Math.sign(x) : 0; };
const ground = (x, z) => hz(z) + wallH(x);
const slopeZ = z => (hz(z - 0.3) - hz(z + 0.3)) / 0.6;       // dh/ds вдоль движения (вперёд = -z)

// ======================= ЗАПУСК =======================
const MEDAL = [34, 44, 58];
const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
const $ = id => document.getElementById(id);
function loadBest() { try { return JSON.parse(localStorage.getItem('miron3d_best')) || {}; } catch (e) { return {}; } }
function saveBest(b) { try { localStorage.setItem('miron3d_best', JSON.stringify(b)); } catch (e) {} }

const W3 = {};
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('game').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const SKY = new THREE.Color(0x9fc9ea);
scene.background = SKY; scene.fog = new THREE.Fog(0xcfe3ee, 70, 280);
const cam = new THREE.PerspectiveCamera(52, 1, 0.1, 600);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// свет и тени
scene.add(new THREE.HemisphereLight(0xcfe2f5, 0x6b5a38, 0.55));
const sun = new THREE.DirectionalLight(0xffe9c4, 1.25);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 60 });
sun.shadow.bias = -0.0006;
scene.add(sun); scene.add(sun.target);

const loader = new THREE.TextureLoader();
const tex = (url, f) => { const t = loader.load(url, f); t.encoding = THREE.sRGBEncoding; return t; };

// панорама: Петербург и осенний парк на горизонте
const bgTex = tex('bg.jpg'); bgTex.wrapS = THREE.RepeatWrapping; bgTex.repeat.set(1.6, 1); bgTex.anisotropy = 4;
const pano = new THREE.Mesh(new THREE.CylinderGeometry(260, 260, 190, 48, 1, true), new THREE.MeshBasicMaterial({ map: bgTex, side: THREE.BackSide, fog: false, depthWrite: false }));
pano.renderOrder = -10; scene.add(pano);
// нижняя «земля» вдали и небо над панорамой
const farGround = new THREE.Mesh(new THREE.CircleGeometry(600, 32), new THREE.MeshBasicMaterial({ color: 0x6f9c4c, fog: false }));
farGround.rotation.x = -Math.PI / 2; farGround.position.y = -6; scene.add(farGround);

// рельеф: бетонная дорожка + обочины-берммы
const ZMAX = 22, ZMIN = -440, DZ = 0.5, NZ = Math.round((ZMAX - ZMIN) / DZ);
function strip(x0, x1, nx, color, texture) {
  const g = new THREE.BufferGeometry(), pos = [], uv = [], idx = [], col = [];
  for (let i = 0; i <= NZ; i++) for (let j = 0; j <= nx; j++) {
    const z = ZMAX - i * DZ, x = x0 + (x1 - x0) * j / nx;
    pos.push(x, ground(x, z), z); uv.push(j / nx, i * DZ / 2.2);
    const n = 0.9 + 0.1 * Math.sin(x * 3.1 + z * 1.7) * Math.cos(z * 0.9); col.push(color.r * n, color.g * n, color.b * n);
  }
  for (let i = 0; i < NZ; i++) for (let j = 0; j < nx; j++) { const a = i * (nx + 1) + j, b = a + 1, c = a + nx + 1, d = c + 1; idx.push(a, b, c, b, d, c); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xffffff, map: texture || null, vertexColors: !texture, roughness: 0.95, metalness: 0 }));
  m.receiveShadow = true; scene.add(m); return m;
}
const concT = tex('conc.jpg'); concT.wrapS = concT.wrapT = THREE.RepeatWrapping; concT.anisotropy = 8; concT.repeat.set(1, 1);
strip(-WALL0, WALL0, 12, new THREE.Color(1, 1, 1), concT);
strip(WALL0, 12, 14, new THREE.Color(0.22, 0.42, 0.12));
strip(-12, -WALL0, 14, new THREE.Color(0.22, 0.42, 0.12));
// белая разметка по краям дорожки
for (const sx of [-WALL0 + 0.05, WALL0 - 0.05]) {
  const pts = []; for (let i = 0; i <= NZ; i += 2) { const z = ZMAX - i * DZ; pts.push(new THREE.Vector3(sx, ground(sx, z) + 0.02, z)); }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xffffff })));
}

// деревья и предметы вдоль трассы
let sd = 11; const rnd = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
const trunkM = new THREE.MeshStandardMaterial({ color: 0x5a3d25, roughness: 1 });
const leafCols = [0xe0a02a, 0xd2691e, 0xc9b030, 0x5f9a3a, 0xb8452a, 0x7aa83a].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, flatShading: true }));
for (let k = 0; k < 150; k++) {
  const side = k % 2 ? 1 : -1, x = side * (14 + rnd() * 22), z = ZMAX - rnd() * (ZMAX - ZMIN - 20), s = 0.8 + rnd() * 0.9;
  const t = new THREE.Group();
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.22 * s, 0.32 * s, 3 * s, 6), trunkM); tr.position.y = 1.5 * s; tr.castShadow = true; t.add(tr);
  const lm = leafCols[(rnd() * leafCols.length) | 0];
  for (let q = 0; q < 3; q++) { const bl = new THREE.Mesh(new THREE.IcosahedronGeometry((1.9 - q * 0.3) * s, 0), lm); bl.position.set((rnd() - 0.5) * s, (3.4 + q * 1.2) * s, (rnd() - 0.5) * s); bl.castShadow = true; t.add(bl); }
  t.position.set(x, ground(Math.abs(x) > 12 ? side * 12 : x, z) - 0.2, z); scene.add(t);
}
const propDefs = { tires: 1.1, log: 0.9, fence: 1.1, bush: 1.7, stump: 0.9, rocks: 1.1, sign: 2.0 };
const propKinds = Object.keys(propDefs);
const propTex = {};
function addProp(kind, x, z, scale) {
  const t = propTex[kind] || (propTex[kind] = tex('prop_' + kind + '.png'));
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, fog: true, transparent: true }));
  const h = propDefs[kind] * (scale || 1); sp.scale.set(h * 1.25, h, 1); sp.center.set(0.5, 0.0);
  sp.position.set(x, ground(Math.max(-12, Math.min(12, x)), z), z); scene.add(sp); return sp;
}
for (let z = 8; z > FINISH - 20; z -= 5 + rnd() * 9) {
  const side = rnd() > 0.5 ? 1 : -1, x = side * (WALL0 + 3.2 + rnd() * 5.5);
  addProp(propKinds[(rnd() * propKinds.length) | 0], x, z, 0.8 + rnd() * 0.6);
}
// флажки на старте и финише
function flags(z) { const t = tex('prop_flags.png'), sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true })); sp.scale.set(7.4, 6.2, 1); sp.center.set(0.5, 0); sp.position.set(0, ground(0, z), z); scene.add(sp); }
flags(6); flags(FINISH);
// чекпоинты — флажки сбоку
CPS.slice(1).forEach(z => { for (const sx of [-1, 1]) { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.2, 6), new THREE.MeshStandardMaterial({ color: 0x333a40 })); m.position.set(sx * 3.3, ground(sx * 3.3, z) + 1.1, z); scene.add(m); const f = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.5), new THREE.MeshBasicMaterial({ color: 0xffd23f, side: THREE.DoubleSide })); f.position.set(sx * 3.3 + 0.45, ground(sx * 3.3, z) + 1.95, z); scene.add(f); } });

// гонщик: 3D-модель Мирона (из нашей картинки)
const rider = new THREE.Group(); rider.rotation.order = 'YXZ'; scene.add(rider);
const shadowBlob = new THREE.Mesh(new THREE.CircleGeometry(0.62, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28, depthWrite: false }));
shadowBlob.rotation.x = -Math.PI / 2; scene.add(shadowBlob);
let modelReady = false;
new THREE.GLTFLoader().load('miron.glb', g => {
  const m = g.scene, box = new THREE.Box3().setFromObject(m), c = box.getCenter(new THREE.Vector3()), sc = 1.55;
  m.traverse(o => { if (o.isMesh) { o.material.metalness = 0; o.material.roughness = 0.85; if (o.material.map) o.material.map.encoding = THREE.sRGBEncoding; o.material.needsUpdate = true; o.castShadow = true; o.receiveShadow = false; o.frustumCulled = false; } });
  m.position.set(-c.x, -box.min.y, -c.z); const holder = new THREE.Group(); holder.add(m); holder.scale.setScalar(sc); holder.rotation.y = Math.PI;
  rider.add(holder); modelReady = true;
});

// ======================= ИГРА =======================
const best = loadBest();
$('best').textContent = best.time ? 'Рекорд: ' + fmt(best.time) : 'Рекорда ещё нет';
const S = { state: 'wait', x: 0, z: 6, y: 0, s: 0, vy: 0, vx: 0, pitch: 0, roll: 0, yaw: 0, pitchW: 0, t: 0, score: 0, flips: 0, air: 0, airRot: 0, wheelie: 0, cp: 0, crashT: 0, lean: 0, held: {}, force: null, neutral: 0, tiltVis: 0, shake: 0, popT: 0, comboT: 0, last: 0 };
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

function popup(text, sub, color) { const p = $('pop'); p.innerHTML = text + (sub ? '<small>' + sub + '</small>' : ''); p.style.color = color || '#ffe14d'; p.style.opacity = 1; clearTimeout(S.popT); S.popT = setTimeout(() => p.style.opacity = 0, 1100); }
function placeAt(z, spd) { S.z = z; S.x = 0; S.y = ground(0, z) + 0.02; S.vy = 0; S.s = spd; S.pitch = Math.atan(slopeZ(z)); S.pitchW = 0; S.air = 0; S.airRot = 0; S.yaw = 0; S.roll = 0; }
function begin() { if (S.state !== 'wait') return; S.state = 'ready'; $('msg').textContent = 'Держи ГАЗ справа и поехали!'; }
function reset() { S.state = 'ready'; S.t = 0; S.score = 0; S.flips = 0; S.cp = 0; $('flips').textContent = 'Сальто: 0'; $('score').textContent = 'Очки: 0'; $('end').style.display = 'none'; placeAt(6, 0); $('msg').textContent = 'Держи ГАЗ справа и поехали!'; }

function readInput() {
  if (S.force) return S.force;
  let lean = 0;
  if (S.held.lb) lean += 1; if (S.held.lf) lean -= 1;      // lean>0 = нос вверх (назад)
  let steer = 0;
  const kb = S.keys || {}; if (kb.ArrowLeft || kb.a) steer -= 1; if (kb.ArrowRight || kb.d) steer += 1;
  if (kb.ArrowUp || kb.w) lean += 1; if (kb.ArrowDown) lean -= 1;
  if (Tilt.on) { const eff = Tilt.val() - S.neutral, dz = 2.5, full = 16 / Tilt.sens; if (Math.abs(eff) > dz) steer += Math.pow(Math.min(1, (Math.abs(eff) - dz) / (full - dz)), 1.1) * Math.sign(eff); }
  return { gas: !!(S.held.gas || kb.Shift || kb.w2), brake: !!(S.held.brk || kb.s), lean: Math.max(-1, Math.min(1, lean)), steer: Math.max(-1, Math.min(1, steer)) };
}

const G9 = 9.8, DT = 1 / 60;
function step(dt) {
  const inp = readInput(), air = S.air > 0.06;
  if (S.state === 'ready') { if (inp.gas) { S.state = 'run'; $('msg').textContent = ''; S.neutral = Tilt.on ? Tilt.val() : 0; } else { applyVisual(dt, inp); return; } }
  if (S.state === 'crash') { S.crashT -= dt; if (S.crashT <= 0) { placeAt(CPS[S.cp] - 4, 7); S.state = 'run'; } applyVisual(dt, inp); return; }
  if (S.state === 'finish') { S.s *= 0.985; S.z -= S.s * dt; S.y = ground(S.x, S.z); applyVisual(dt, { gas: 0, brake: 0, lean: 0, steer: 0 }); return; }
  if (S.state !== 'run') return;
  S.t += dt; S.comboT = Math.max(0, S.comboT - dt);
  // продольная скорость
  const sl = slopeZ(S.z);
  if (!air) {
    S.s += (inp.gas ? 6.5 : 0) * dt - (inp.brake ? 13 : 0) * dt - G9 * Math.sin(Math.atan(sl)) * dt * 0.9 - S.s * 0.035 * dt - 0.35 * dt;
    if (inp.gas && S.s > 13.5) S.s = 13.5;
  } else S.s *= (1 - 0.01 * dt);
  S.s = Math.max(0, Math.min(S.s, 19));
  // руление
  S.vx += (inp.steer * 7.5 - S.vx) * Math.min(1, dt * 6);
  S.x += S.vx * dt * Math.min(1, 0.3 + S.s / 9);
  S.x = Math.max(-5.6, Math.min(5.6, S.x));
  S.z -= S.s * dt;
  // вертикаль: частица с «приклеиванием» к земле
  const gy = ground(S.x, S.z);
  S.vy -= G9 * dt; S.y += S.vy * dt;
  if (S.y <= gy + 0.0) {
    const was = S.air; S.y = gy;
    const gslope = Math.atan(slopeZ(S.z));
    if (was > 0.1) landing(was, gslope);
    S.vy = S.s * Math.tan(gslope) * 0.98 + (S.vy < -3 ? 0 : 0); S.air = 0;
  } else if (S.y - gy > 0.06) { S.air += dt; }
  else { S.air = Math.max(0, S.air - dt * 3); }
  // наклон байка
  const gsl = Math.atan(slopeZ(S.z));
  if (S.air > 0.06) {
    const omega = inp.lean * 7.6;
    S.pitchW += (omega - S.pitchW) * Math.min(1, dt * 9);
    if (Math.abs(inp.lean) < 0.05) S.pitchW += (angDiff(gsl, S.pitch) * 2.2 - S.pitchW) * Math.min(1, dt * 2.5) * (S.air > 0.5 ? 1 : 0.3);
    S.pitch += S.pitchW * dt; S.airRot += S.pitchW * dt * (Math.abs(inp.lean) > 0.05 ? 1 : 0);
  } else {
    const want = gsl + inp.lean * 0.42; S.pitch += (want - S.pitch) * Math.min(1, dt * 8); S.pitchW = 0;
    if (inp.lean > 0.5 && S.s > 3) { S.wheelie += dt; if (S.wheelie > 1) { S.wheelie -= 1; S.score += 30; popup('ВИЛЛИ!', '+30', '#7dd7ff'); } } else S.wheelie = Math.max(0, S.wheelie - dt);
  }
  // чекпоинты и финиш
  for (let i = S.cp + 1; i < CPS.length; i++) if (S.z < CPS[i]) { S.cp = i; popup('Чекпоинт!', '', '#fff'); Sfx.check(); }
  if (S.z < FINISH) finish();
  applyVisual(dt, inp);
}
function landing(air, gslope) {
  const err = angDiff(S.pitch, gslope), flips = Math.floor((Math.abs(S.airRot) + 1.1) / (2 * Math.PI));
  if (Math.abs(err) > 1.05) { crash(); return; }
  Sfx.land(); S.shake = Math.min(0.5, 0.15 + air * 0.25);
  if (flips >= 1) { const pts = 100 * flips * (1 + Math.min(S.comboT > 0 ? 1 : 0, 1)); S.flips += flips; S.score += pts; S.comboT = 3; S.shake = 0.6; Sfx.flip(); popup(flips > 1 ? 'x' + flips + ' САЛЬТО!' : 'САЛЬТО!', '+' + pts, '#ffe14d'); $('flips').textContent = 'Сальто: ' + S.flips; $('score').textContent = 'Очки: ' + S.score; }
  else if (air > 0.6 && Math.abs(err) < 0.3) { S.score += 20; popup('Чисто!', '+20', '#9dffb0'); $('score').textContent = 'Очки: ' + S.score; }
  S.airRot = 0; S.pitch = gslope + err * 0.3; S.s = Math.max(S.s * 0.97, S.s - 0.4);
}
function crash() { S.state = 'crash'; S.crashT = 1.0; S.shake = 0.8; S.s = 0; Sfx.crash(); popup('Упал!', 'ещё раз с чекпоинта', '#ff6b6b'); S.airRot = 0; }
function finish() {
  if (S.state === 'finish') return; S.state = 'finish'; Sfx.fanfare();
  const t = S.t, medal = t <= MEDAL[0] ? 0 : t <= MEDAL[1] ? 1 : t <= MEDAL[2] ? 2 : -1, rec = !best.time || t < best.time;
  if (rec) best.time = t; saveBest(best); $('best').textContent = 'Рекорд: ' + fmt(best.time);
  setTimeout(() => { $('medal').textContent = ['🥇 ЗОЛОТО!', '🥈 СЕРЕБРО!', '🥉 БРОНЗА!', 'Почти! Ещё разок?'][medal < 0 ? 3 : medal]; $('etime').textContent = fmt(t) + (rec ? '  новый рекорд!' : '  рекорд ' + fmt(best.time)); $('estat').textContent = 'сальто ' + S.flips + '   очки ' + S.score; $('end').style.display = 'flex'; }, 1600);
}

// визуал: положение, камера, интерфейс
const camPos = new THREE.Vector3(0, 3, 12), lookP = new THREE.Vector3();
function applyVisual(dt, inp) {
  const gy = ground(S.x, S.z);
  S.roll += ((-inp.steer * 0.42 - wallSlope(S.x) * 0.7 * (S.air > 0.06 ? 0 : 1)) - S.roll) * Math.min(1, dt * 8);
  S.tiltVis += (inp.steer - S.tiltVis) * 0.3;
  rider.position.set(S.x, S.y, S.z); rider.rotation.set(S.pitch, -S.vx * 0.04, S.roll);
  shadowBlob.position.set(S.x, gy + 0.05, S.z); const hh = Math.max(0, S.y - gy); shadowBlob.scale.setScalar(Math.max(0.5, 1 - hh * 0.2)); shadowBlob.material.opacity = Math.max(0.06, 0.3 - hh * 0.08);
  sun.position.set(S.x - 7, S.y + 14, S.z + 8); sun.target.position.set(S.x, S.y, S.z);
  // камера сзади
  const speedK = Math.min(1, S.s / 13.5), want = new THREE.Vector3(S.x * 0.6, Math.max(gy + 1.35, S.y + 1.6 - Math.min(0.35, S.air)), S.z + 3.3 + speedK * 1.0);
  camPos.lerp(want, Math.min(1, dt * 5)); camPos.y = Math.max(camPos.y, ground(camPos.x, camPos.z) + 0.8);
  cam.position.copy(camPos);
  if (S.shake > 0) { cam.position.x += (Math.random() - 0.5) * S.shake * 0.25; cam.position.y += (Math.random() - 0.5) * S.shake * 0.25; S.shake *= 0.9; if (S.shake < 0.01) S.shake = 0; }
  lookP.set(S.x * 0.8, S.y + 0.85, S.z - 9); cam.lookAt(lookP);
  cam.rotation.z = -S.roll * 0.12;
  const fov = 52 + speedK * 9 + (S.air > 0.06 ? 3 : 0); if (Math.abs(cam.fov - fov) > 0.05) { cam.fov += (fov - cam.fov) * 0.08; cam.updateProjectionMatrix(); }
  pano.position.set(cam.position.x, cam.position.y + 58, cam.position.z); farGround.position.set(S.x, -6, S.z);
  // интерфейс
  $('time').textContent = fmt(S.t); $('speed').firstElementChild.style.width = Math.min(100, S.s / 13.5 * 100) + '%';
  $('lines').style.opacity = Math.max(0, (S.s - 8) / 5) * (S.state === 'run' ? 1 : 0);
  if (Tilt.on) { $('gauge').style.display = 'block'; $('glbl').style.display = 'block'; $('gauge').children[1].style.transform = 'rotate(' + (S.tiltVis * 50) + 'deg)'; }
}

// ввод: кнопки
function bindBtn(id, key) {
  const el = $(id);
  const on = e => { e.preventDefault(); Sfx.init(); S.held[key] = true; el.classList.add('on'); Sfx.click(); try { navigator.vibrate && navigator.vibrate(10); } catch (x) {} };
  const off = e => { e.preventDefault(); S.held[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
bindBtn('gas', 'gas'); bindBtn('brk', 'brk'); bindBtn('lb', 'lb'); bindBtn('lf', 'lf');
$('gauge').addEventListener('pointerdown', () => { S.neutral = Tilt.val(); Sfx.click(); });
S.keys = {}; addEventListener('keydown', e => { S.keys[e.key] = true; if (e.key === ' ') S.keys.Shift = true; Sfx.init(); }); addEventListener('keyup', e => { S.keys[e.key] = false; if (e.key === ' ') S.keys.Shift = false; });
$('again').onclick = () => reset();

// главный цикл
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - (S.last || now)) / 1000); S.last = now;
  let acc = dt, guard = 0; while (acc > 0 && guard++ < 6) { const d = Math.min(DT, acc); step(d); acc -= d; }
  if (S.state === 'wait') { camPos.set(0, 2.4, 11); cam.position.copy(camPos); cam.lookAt(0, 1.2, 0); rider.position.set(0, ground(0, 6), 6); rider.rotation.set(0, 0.6 + now * 0.0004, 0); }
  renderer.render(scene, cam);
}
placeAt(6, 0); S.state = 'wait';
requestAnimationFrame(loop);
window.G = { S, step, reset, begin, Tilt, hz, ground, scene, cam, renderer, rider, ready: () => modelReady };

// стартовый экран
(function startScreen() {
  const start = $('start'), calib = $('calib'), bar = $('bar'), go = $('go'), skip = $('skip');
  function launch() { start.style.display = 'none'; Sfx.init(); placeAt(6, 0); S.state = 'wait'; begin(); camPos.set(0, 3, 12); }
  try { const v = parseFloat(localStorage.getItem('miron_sens')); if (v) Tilt.sens = v; } catch (e) {}
  document.querySelectorAll('#sens button').forEach(b => {
    b.classList.toggle('on', parseFloat(b.dataset.s) === Tilt.sens);
    b.onclick = () => { Tilt.sens = parseFloat(b.dataset.s); try { localStorage.setItem('miron_sens', String(Tilt.sens)); } catch (e) {} document.querySelectorAll('#sens button').forEach(x => x.classList.toggle('on', x === b)); };
  });
  skip.onclick = () => { Tilt.on = false; launch(); };
  go.onclick = async () => {
    Sfx.init();
    const ok = await Tilt.enable();
    if (!ok) { calib.textContent = 'Наклон не включился, играем кнопками'; setTimeout(launch, 900); return; }
    go.style.display = 'none'; skip.textContent = 'пропустить'; bar.style.display = 'block';
    calib.textContent = 'Держи телефон ровно, потом наклони ВПРАВО, как руль';
    Tilt.prev = null; Tilt.raw = 0; Tilt.smooth = undefined; Tilt.base = 0;
    const t0 = performance.now(); let base = null, done = false;
    const iv = setInterval(() => {
      if (Tilt.smooth === undefined) { if (performance.now() - t0 > 2500) { clearInterval(iv); Tilt.on = false; calib.textContent = 'Датчик не отвечает, играем кнопками'; setTimeout(launch, 900); } return; }
      if (base === null) { if (performance.now() - t0 > 900) base = Tilt.smooth; return; }
      if (performance.now() - t0 > 12000 && !done) { done = true; clearInterval(iv); Tilt.on = false; calib.textContent = 'Не вышло, играем кнопками'; setTimeout(launch, 900); return; }
      const d = Tilt.smooth - base;
      bar.firstElementChild.style.width = (50 + Math.max(-30, Math.min(30, d)) / 30 * 50) + '%';
      if (Math.abs(d) > 14 && !done) { done = true; clearInterval(iv); Tilt.sign = d > 0 ? 1 : -1; Tilt.base = base; calib.textContent = 'Отлично! Наклон настроен'; setTimeout(launch, 700); }
    }, 50);
    skip.onclick = () => { clearInterval(iv); Tilt.on = false; launch(); };
  };
})();
</script>
